# ============================================================
#  网站总配置文件
#  改完这个文件后，网站会自动刷新，不用重启
# ============================================================

# ---------- 网站基本信息 ----------
site_name: ysweb喵          # ← 想改网站名字，改这一行即可
site_description: 一个简洁的个人网站
site_author: 我

# ---------- 主题外观 ----------
theme:
  name: material        # 使用 Material 主题
  language: zh          # 界面文字使用中文
  palette:
    - scheme: default   # 纯白配色（浅色模式）
      primary: white
      accent: indigo
  features:
    - navigation.top        # 右上角"回到顶部"按钮
    - search.suggest        # 搜索时给出建议词
    - content.code.copy     # 代码块右下角"复制"按钮

# ---------- 顶部导航菜单（顺序：主页、课程、友链、关于、更新日志）----------
nav:
  - 主页: index.md
  - 课程: course/index.md
  - 友链: friends/index.md
  - 关于: about/index.md
  - 更新日志: changelog.md   # 新增的页面加在这里

# ---------- 写文章时可以使用的增强写法 ----------
markdown_extensions:
  - admonition            # 提示框（!!! note）
  - pymdownx.details      # 可折叠的提示框
  - pymdownx.superfences  # 代码块
  - attr_list
  - md_in_html            # 允许在 HTML 里写 Markdown
  - tables                # 表格
  - fenced_code
  - toc:
      permalink: true     # 标题旁边的小链接图标
